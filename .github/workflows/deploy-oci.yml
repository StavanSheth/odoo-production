name: Deploy Odoo 18 to Oracle Cloud Infrastructure (OCI)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to OCI VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 141.148.210.199
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Pulling latest changes on Oracle Cloud VM ==="
            cd ~/odoo18
            git pull origin main
            
            echo "=== Updating Docker Containers ==="
            sudo docker compose up -d
            
            echo "=== Running Health Check Suite ==="
            sudo bash scripts/health-check.sh http://127.0.0.1:8080
            echo "=== Deployment Successfully Completed ==="

