services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Internal only, no public port mapping)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:${POSTGRES_IMAGE_TAG:-15-alpine}
    container_name: odoo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - odoo_internal

  # ---------------------------------------------------------------------------
  # Odoo 18.0 Community Application Server
  # ---------------------------------------------------------------------------
  web:
    image: odoo:${ODOO_IMAGE_TAG:-18.0}
    container_name: odoo_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo
      - ./extra-addons:/mnt/extra-addons
    networks:
      - odoo_internal

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Reverse proxy, buffering, static caching, WebSockets)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: odoo_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${LOCAL_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - odoo_internal

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel (Optional Profile: --profile tunnel)
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: odoo_tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      - nginx
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - odoo_internal

# -----------------------------------------------------------------------------
# Persistent Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: odoo_postgres_data
  odoo_data:
    name: odoo_web_data

networks:
  odoo_internal:
    name: odoo_internal_network
    driver: bridge

