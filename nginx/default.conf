# =============================================================================
# Odoo 18 Nginx Virtual Host & Reverse Proxy
# =============================================================================

upstream odoo_web {
    server web:8069;
}

upstream odoo_chat {
    server web:8072;
}

server {
    listen 80;
    server_name _;

    # Maximum file upload size for large document/module imports
    client_max_body_size 100M;

    # Proxy timeouts
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Standard Proxy Headers
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Restrict Database Manager from public web exposure
    # -------------------------------------------------------------------------
    location ~* /web/database/(manager|selector) {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://odoo_web;
    }

    # -------------------------------------------------------------------------
    # Odoo 18 Gevent WebSocket Routes (/websocket and /websocket/)
    # -------------------------------------------------------------------------
    location ~* ^/websocket/? {
        proxy_pass http://odoo_chat;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backward compatibility for longpolling
    location /longpolling {
        proxy_pass http://odoo_chat;
    }

    # -------------------------------------------------------------------------
    # Static Assets Caching
    # -------------------------------------------------------------------------
    location ~* /web/static/ {
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 7d;
        proxy_pass http://odoo_web;
    }

    # -------------------------------------------------------------------------
    # Standard Odoo HTTP Web Requests (:8069)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://odoo_web;
        proxy_redirect off;
    }
}

